name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync mypy
      - run: uv run --frozen --no-sync python scripts/validate_distribution.py
      - name: Secret scan
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- ':!uv.lock'; then
            exit 1
          fi

  linux-media:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    env:
      SOCIAL_VIDEO_FORCE_CPU: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      # mypy's target is 3.12, so the declared floor is type-checked here, in an
      # environment whose stubs a 3.10 checker can parse.
      - if: matrix.python == '3.10'
        run: uv run --frozen --no-sync --python 3.10 mypy --python-version 3.10
      - if: matrix.python != '3.12'
        run: uv run --frozen --no-sync --python ${{ matrix.python }} pytest -q
      - if: matrix.python == '3.12'
        run: >-
          uv run --frozen --no-sync --python 3.12 pytest -q
          --cov --cov-report=term:skip-covered --cov-report=xml
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  # The runner image's ffmpeg is one major version behind current distributions,
  # which is how a frame-padding regression on ffmpeg 7 stayed invisible here
  # while it shortened real renders. Render timing is checked on both.
  ffmpeg-next:
    runs-on: ubuntu-latest
    container: ubuntu:25.04
    env:
      SOCIAL_VIDEO_FORCE_CPU: '1'
      PYTHONUTF8: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: |
          apt-get update
          apt-get install -y ffmpeg fontconfig fonts-noto-core python3 python3-venv curl git
      # The container runs as root while the workspace belongs to the runner
      # user, which git reads as dubious ownership and refuses with exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: ffmpeg -version | head -1
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --no-sync pytest -q tests/integration/test_render_timestamps.py tests/unit

  portability-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOCIAL_VIDEO_FORCE_CPU: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen --no-sync --python 3.12 pytest tests/unit -q

  powershell-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Warning,Error
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($findings | Where-Object Severity -eq 'Error') { exit 1 }

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uvx twine check dist/*.whl dist/*.tar.gz
      - run: ./scripts/build-skill.sh
      - run: uv venv /tmp/social-video-package-test
      - run: uv pip install --python /tmp/social-video-package-test/bin/python dist/*.whl
      - run: /tmp/social-video-package-test/bin/social-video-agent version
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidates
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/social-video-agent-skill.zip

  remotion-smoke:
    runs-on: ubuntu-latest
    env:
      SOCIAL_VIDEO_FORCE_CPU: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npx remotion browser ensure
      - run: uv run --frozen --no-sync pytest tests/integration/test_remotion.py -q
      - run: uv run --frozen --no-sync social-video-agent doctor --json
      - name: Install the compositor from the wheel, outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          SOCIAL_VIDEO_HOME: ${{ runner.temp }}/social-video-home
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE"
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/social-video-agent" doctor --install-remotion
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "from social_video.remotion_runtime import locate_runtime; r = locate_runtime(); assert r and not r.from_checkout and r.dependencies_installed, r"
