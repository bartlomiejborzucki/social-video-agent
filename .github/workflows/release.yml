name: release

on:
  push:
    tags: ['v*.*.*']

# Building and testing runs third-party code (npm, the test suite), so it gets
# a read-only token. Only the job that creates the release may write.
permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/social_video/__init__.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
      - run: uv sync --frozen --extra dev
      - run: npm ci
      - run: npx remotion browser ensure
      - run: ./scripts/release-check.sh
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/social-video-agent-skill.zip
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: |
            dist/*.whl
            dist/*.tar.gz

  github-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/social-video-agent-skill.zip
            dist/SHA256SUMS

  # Trusted publishing: no token is stored anywhere. Off until the PyPI project
  # names this repository and workflow as a trusted publisher and the repository
  # variable PYPI_PUBLISH is set to "true"; see CONTRIBUTING.md.
  pypi:
    needs: build-release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
