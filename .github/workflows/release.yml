name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
      - run: uv sync --extra dev
      - run: npm ci
      - run: npx remotion browser ensure
      - run: ./scripts/release-check.sh
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/social-video-agent-skill.zip
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: |
            dist/*.whl
            dist/*.tar.gz

  # Trusted publishing: no token is stored anywhere. Off until the PyPI project
  # names this repository and workflow as a trusted publisher and the repository
  # variable PYPI_PUBLISH is set to "true"; see CONTRIBUTING.md.
  pypi:
    needs: build-release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
