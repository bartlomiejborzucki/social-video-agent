[project]
name = "social-video-agent"
version = "0.1.0"
description = "Agent-native social video editor: a coding agent edits video through inspectable artifacts and deterministic local tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.14"
keywords = ["video", "editing", "agent", "skills", "ffmpeg", "shorts", "reels", "captions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "numpy>=1.26",
    "pillow>=10.3",
    # Real glyph-coverage checks. Without it we cannot tell a font that renders
    # Polish diacritics from one that will silently emit tofu boxes.
    "fonttools>=4.50",
    # Default transcription backend. MIT, no PyTorch, ungated models, CPU-viable.
    "faster-whisper>=1.1",
    # Scene detection. Use the -headless distribution so servers/containers do not
    # pull a GUI OpenCV. Do NOT depend on `scenedetect-core`: 0.7.1 was yanked.
    "scenedetect-headless>=0.7",
]

[project.optional-dependencies]
# Forced alignment for tighter word timestamps. Alignment itself needs no HF token.
# Heavy: pulls torch/torchaudio/torchcodec (~5-8 GB). torchcodec has no linux-aarch64 wheels.
align = ["whisperx>=3.8"]
# Speaker diarization. Code is MIT but the pretrained weights are GATED: the user must
# accept `pyannote/speaker-diarization-community-1` conditions and supply their own HF token.
# We cannot redistribute the weights or ship a shared token.
diarize = ["pyannote.audio>=4.0"]
# Cloud transcription providers. Uploads your media off-device.
cloud = ["requests>=2.32"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
social-video = "social_video.cli:app"

[project.urls]
Homepage = "https://github.com/OWNER/social-video-agent"
Upstream = "https://github.com/browser-use/video-use"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_video"]

[tool.hatch.build.targets.wheel.force-include]
"src/social_video/profiles/data" = "social_video/profiles/data"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.ruff.lint.isort]
known-first-party = ["social_video", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is a package so integration tests can import shared fixture builders.
pythonpath = ["."]
markers = [
    "integration: requires ffmpeg and generates media fixtures",
    "slow: takes more than a few seconds",
]

[tool.mypy]
python_version = "3.10"
packages = ["social_video"]
ignore_missing_imports = true
