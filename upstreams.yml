    license: MIT (names parleyw as sole holder over Browser Use code; see provenance)
    reviewed_sha: dbfba03
    reviewed_on: 2026-09-15
    integration: design
    components: []
    watch_for:
      - Whether the fabricated word timestamps are ever fixed
    notes: >
      Audited and rejected. Four backends fabricate word timestamps; both
      diarization backends call a pyannote method that does not exist. Only the
      validate_setup() lifecycle idea was taken, reimplemented from scratch.

