# Projects we track.
#
# `reviewed_sha` is the commit we actually read. The upstream monitor compares
# it against HEAD and opens an issue when they differ. It never merges.
#
# integration values:
#   adapted     - code from this project exists here, modified, with attribution
#   design      - concepts adopted, no code copied
#   dependency  - consumed as a package, no code copied
#   reference   - read for current best practice, nothing taken
#   watch       - not used, but relevant if it changes

version: 1

upstreams:
  - repository: browser-use/video-use
    url: https://github.com/browser-use/video-use
    purpose: Primary architectural ancestor; the transcript-first agent editing pipeline.
    license: MIT
    reviewed_sha: 9575612f066aa517354790a645fd90f9f95a743b
    reviewed_on: 2026-09-15
    integration: adapted
    components:
      - src/social_video/ffmpeg/probe.py
      - src/social_video/ffmpeg/filters.py
      - src/social_video/transcript/pack.py
      - src/social_video/transcribe/audio.py
      - skills/social-video-editor/SKILL.md
    watch_for:
      - Local transcription finally landing upstream
      - Windows path and encoding fixes we also carry
      - Any reframing or vertical output capability
      - Changes to helpers/render.py that affect ported functions
    notes: >
      Merges roughly 9 of 87 pull requests ever opened. Treat upstream movement
      as informative rather than as something to merge from.

  - repository: parleyw/video-use
