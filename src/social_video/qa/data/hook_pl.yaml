# Słowa, po których `hook check` rozpoznaje otwarcie rolki. Wpis to jedno słowo
# albo krótka fraza, małymi literami, bez interpunkcji. Słowa porównywane są po
# początku (rdzeniu), więc „kaw” łapie „kawa”, „kawy”, „kawą”.
#
# Te listy są ogólne. Projekt może je podmienić plikiem
# `.social-video/hook-words.yaml` w swoim katalogu: każda kategoria podana tam
# zastępuje tę stąd, pozostałe zostają.

# Konkretna sytuacja w temacie projektu: kto i co się dzieje. Pusta, bo zależy od
# niszy; projekt ją uzupełnia. Bez niej `hook check` tego nie ocenia.
situation: []

# Zwrot do widza.
address:
  - ty
  - ci
  - cię
  - ciebie
  - twoj
  - twoje
  - twój
  - twoja
  - twoim
  - wiesz
  - znasz
  - masz
  - mówisz
  - robisz
  - czujesz
  - słyszysz
  - zrób
  - spróbuj
  - zapisz

# Napięcie albo pytanie bez odpowiedzi.
tension:
  - a teraz
  - przecież
  - znowu
  - nagle
  - dlaczego
  - co zrobić
  - co robić
  - ale
  - nigdy
  - zawsze
  - wcale
  - nie chce
  - nie chcę

# Nazwa, tytuł, autopromocja: nie otwiera się na nich rolki.
promo:
  - książk
  - moja nowa
  - mojej nowej
  - premier
  - webinar
  - kurs
  - szkoleni
  - odcinek
  - rozdział
  - link
  - lista zapisów
  - zapisz się
  - w tym filmie
  - dzisiaj opowiem
  - dziś opowiem
  - dzisiaj pokażę

# Powitania.
greeting:
  - cześć
  - hej
  - hejka
  - siema
  - dzień dobry
  - witaj
  - witajcie
  - witam
  - kochani
