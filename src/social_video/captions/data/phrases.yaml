    po pierwsze: 1
    po drugie: 2
    po trzecie: 3
    po czwarte: 4
    po piąte: 5
    krok 1: 1
    krok 2: 2
    krok 3: 3
    krok 4: 4
    krok 5: 5
    krok pierwszy: 1
    krok drugi: 2
    krok trzeci: 3
    pierwszy krok: 1
    drugi krok: 2
    trzeci krok: 3
  en:
